<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michango Manager — Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Michango Manager 🏠</h1>
      <!-- Data yote sasa inatoka DATABASE — hakuna ya kubuni tena -->
      <p class="event-name" id="eventName">Inapakia...</p>
    </header>

    <main>
      <!-- FR-F1: Dashboard ya tukio -->
      <section class="cards">
        <article class="card">
          <p class="label">Jumla Iliyokusanywa</p>
          <p class="value" id="collected">—</p>
        </article>
        <article class="card">
          <p class="label">Lengo</p>
          <p class="value" id="target">—</p>
        </article>
        <article class="card highlight">
          <p class="label">Asilimia ya Lengo</p>
          <div class="donut" id="donut">
            <span class="donut-text" id="percent">—</span>
          </div>
        </article>
      </section>

      <!-- FR-F2: Orodha ya wachangiaji -->
      <section class="list">
        <h2>Wachangiaji</h2>
        <table>
          <thead>
            <tr>
              <th>Jina</th>
              <th>Ahadi</th>
              <th>Amelipa</th>
              <th>Status</th>
            </tr>
          </thead>
          <!-- tbody ni TUPU: JavaScript itaijaza kutoka database -->
          <tbody id="contributorRows"></tbody>
        </table>
        <p class="note">
          Data hii inatoka Supabase — halisi, siyo ya kubuni. Ibadilishe kwenye
          database, refresh, na uone. ✨
        </p>
      </section>
    </main>

    <footer>
      <p>Safari ya Software Development — TEHAMA TDC Global</p>
    </footer>

    <!-- 1. Library ya Supabase (kutoka CDN — hakuna npm bado) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Daraja letu: URL na key -->
    <script src="js/supabase.js"></script>
    <!-- 3. App yetu -->
    <script src="js/app.js"></script>
  </body>
</html>
